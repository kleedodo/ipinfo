name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux (Debian/glibc) --- x86_64 + arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ipinfo-linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ipinfo-linux-aarch64

          # --- macOS (native Apple Silicon arm64) ---
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ipinfo-macos-aarch64

          # --- Windows (native x86_64) ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ipinfo-windows-x86_64.exe

          # --- OpenBSD (cross-compile from Linux via zig) ---
          - os: ubuntu-latest
            target: x86_64-unknown-openbsd
            artifact: ipinfo-openbsd-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- Linux aarch64: need cross-compiler ---
      - name: Install aarch64 Linux cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # --- OpenBSD: zig provides a portable C linker/CC ---
      - name: Install zig for OpenBSD cross-compilation
        if: contains(matrix.target, 'openbsd')
        run: |
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "${{ github.workspace }}/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH

      # --- Build ---
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # Zig serves as the C linker for OpenBSD targets
          CC_x86_64_unknown_openbsd: zig cc
          CARGO_TARGET_X86_64_UNKNOWN_OPENBSD_LINKER: zig cc

      # --- Strip debug symbols (Unix only) ---
      - name: Strip binary
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/ipinfo

      # --- Package ---
      - name: Package artifact
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/ipinfo"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="${BIN}.exe"
          fi
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.artifact }}"
          tar czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"

      # --- Upload to GitHub Artifacts ---
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
